name: Companion Windows installer

# Builds "AIBody Companion Setup.exe": PyInstaller (windowed, onedir) around aibody_companion/winapp.py, wrapped by
# Inno Setup (per-user install). Runs the launcher's --selftest on the frozen exe, checks that /VAMDIR= without VaM.exe
# is refused, installs silently with /VAMDIR= (fake VaM folder), checks launcher.json and --check-vam-root, self-tests the
# installed copy, uninstalls, scans for keys and uploads the installer as an artifact. Releases attach it by hand.
# Version 44: builds the package d0n.AIBody.<v>.var first (tools/build_var.py) and bundles it (/DVarFile, /DVarSha256);
# checks that every install copies it to <VaM>\AddonPackages and removes the other d0n.AIBody.<n>.var (fresh install with
# hand-placed old packages), that a same-version reinstall over a RUNNING companion ends it and replaces everything,
# that an older installed version is reported as an update, and that the VAR is uploaded with the installer.
# After v44 (Don 21:25): a failed install (companion file locked, /NOCLOSEAPPLICATIONS) keeps the older package; the
# next run copies the new one first and removes the older ones after that.
# Version 49 (Dollmaster tab): the VAR also packs assets/dollmaster, so changes there trigger the build too.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "companion/**"
      - "packaging/**"
      - "src/**"
      - "examples/scenes/**"
      - "assets/dollmaster/**"
      - "tools/build_var.py"
      - "tools/assemble_plugins.py"
      - "tools/sandbox_rules.py"
      - "tools/scan_tokens.py"
      - ".github/workflows/companion-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools and bundled dependencies (win_amd64 wheels only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: pyinstaller sounddevice webrtcvad-wheels pystray==0.19.5 pillow

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0, 'companion'); import aibody_companion as a; print(a.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "AIBody companion version $v"

      - name: Launcher unit tests
        working-directory: companion
        run: python -m unittest tests.test_winapp -v

      - name: PyInstaller (windowed, onedir)
        run: >
          pyinstaller --noconfirm --clean --windowed --name "AIBody Companion"
          --paths companion --collect-submodules aibody_companion
          --hidden-import webrtcvad --hidden-import pystray._win32
          --distpath dist --workpath build/pyinstaller --specpath build/pyinstaller
          packaging/companion/aibody_companion_app.py

      - name: Self-test of the frozen exe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          $p = Start-Process -FilePath "dist\AIBody Companion\AIBody Companion.exe" -ArgumentList "--selftest","--selftest-out","`"$out`"" -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Package (VAR) for the installer
        id: var
        shell: pwsh
        run: |
          python tools/build_var.py --version ${{ steps.ver.outputs.version }}
          if ($LASTEXITCODE -ne 0) { throw "build_var failed" }
          $var = Resolve-Path "dist\d0n.AIBody.${{ steps.ver.outputs.version }}.var"
          $sha = (Get-FileHash $var -Algorithm SHA256).Hash.ToLower()
          "path=$var" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "package $var sha256 $sha"

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          $src = Resolve-Path "dist\AIBody Companion"
          New-Item -ItemType Directory -Force dist\installer | Out-Null
          $outdir = Resolve-Path "dist\installer"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$src" "/DOutputDir=$outdir" "/DVarFile=${{ steps.var.outputs.path }}" "/DVarSha256=${{ steps.var.outputs.sha256 }}" packaging\companion\AIBodyCompanion.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist\installer | Format-Table Name, Length

      - name: Silent install with /VAMDIR=, launcher.json, self-test of the installed copy, uninstall
        shell: pwsh
        run: |
          $setup = Resolve-Path "dist\installer\AIBody Companion Setup.exe"
          $app = Join-Path $env:LOCALAPPDATA "Programs\AIBody Companion"
          $exe = Join-Path $app "AIBody Companion.exe"
          $json = Join-Path $env:LOCALAPPDATA "AIBody Companion\launcher.json"
          $log = Join-Path $env:RUNNER_TEMP "setup.log"
          # 0. no /VAMDIR= and no VaM on the runner: the setup runs its detection, installs, and writes no launcher.json
          $log0 = Join-Path $env:RUNNER_TEMP "setup-detect.log"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/LOG=`"$log0`"" -Wait -PassThru
          Select-String -Path $log0 -Pattern "VaM folder|launcher.json|Exception|Error|error" | ForEach-Object { $_.Line }
          if ($p.ExitCode -ne 0) { Get-Content $log0 | Select-Object -Last 60; throw "setup without VAMDIR: exit code $($p.ExitCode)" }
          if (-not (Test-Path $exe)) { throw "setup without VAMDIR: not installed at $exe" }
          if (Test-Path $json) { throw "setup without VAMDIR wrote $json although there is no VaM" }
          $p = Start-Process -FilePath (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "uninstall left $exe" }
          Write-Host "setup without VAMDIR ok (detection ran, nothing remembered)"
          # 1. a /VAMDIR= folder without VaM.exe must stop the setup before anything is installed
          $bad = Join-Path $env:RUNNER_TEMP "Not VaM"
          New-Item -ItemType Directory -Force $bad | Out-Null
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/VAMDIR=`"$bad`"" -Wait -PassThru
          if ($p.ExitCode -eq 0) { throw "setup accepted a VAMDIR without VaM.exe" }
          if (Test-Path $exe) { throw "installed although VAMDIR had no VaM.exe" }
          Write-Host "invalid VAMDIR refused (exit code $($p.ExitCode))"
          # 2. a fake VaM folder (only VaM.exe, a space in its path), outside the install folder
          $vam = Join-Path $env:RUNNER_TEMP "Fake VaM"
          New-Item -ItemType Directory -Force $vam | Out-Null
          New-Item -ItemType File -Force (Join-Path $vam "VaM.exe") | Out-Null
          # version 43/44: hand-placed old packages and decoys. A fresh install (nothing installed) removes exactly the
          # d0n.AIBody.<digits>.var at the top of AddonPackages and copies the new one; the uninstaller removes ours only.
          $pk = Join-Path $vam "AddonPackages"
          New-Item -ItemType Directory -Force (Join-Path $pk "Sub") | Out-Null
          foreach ($n in "d0n.AIBody.41.var","d0n.AIBody.42.var","d0n.AIBodySession.3.var","d0n.AIBody.x.var","other.AIBody.1.var","Sub\d0n.AIBody.40.var") {
            New-Item -ItemType File -Force (Join-Path $pk $n) | Out-Null
          }
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/VAMDIR=`"$vam`"","/LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log; throw "setup exit code $($p.ExitCode)" }
          Select-String -Path $log -Pattern "VaM folder|launcher.json|Existing install|Package:|Remove older|Deleted|taskkill" | ForEach-Object { $_.Line }
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          $v = "${{ steps.ver.outputs.version }}"
          $newvar = Join-Path $pk "d0n.AIBody.$v.var"
          $sha = "${{ steps.var.outputs.sha256 }}"
          function Assert-Packages([string]$when) {
            if (-not (Test-Path $newvar)) { throw "${when}: $newvar missing" }
            $got = (Get-FileHash $newvar -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $sha) { throw "${when}: $newvar sha256 $got is not the bundled $sha" }
            foreach ($n in "d0n.AIBody.41.var","d0n.AIBody.42.var") { if (Test-Path (Join-Path $pk $n)) { throw "${when}: $n not removed" } }
            foreach ($n in "d0n.AIBodySession.3.var","d0n.AIBody.x.var","other.AIBody.1.var","Sub\d0n.AIBody.40.var","..\VaM.exe") {
              if (-not (Test-Path (Join-Path $pk $n))) { throw "${when}: $n deleted (not ours)" }
            }
            Write-Host "${when}: d0n.AIBody.$v.var present (sha256 ok), d0n.AIBody.41/42.var removed, decoys kept"
          }
          if (-not (Select-String -Path $log -Pattern "Existing install: none \(new install\)" -Quiet)) { throw "fresh install not logged as new install" }
          Assert-Packages "fresh install"
          $menu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\AIBody Companion\AIBody Companion.lnk"
          if (-not (Test-Path $menu)) { throw "no Start menu shortcut at $menu" }
          if (-not (Test-Path $json)) { throw "setup did not write $json" }
          Get-Content $json
          $cfg = Get-Content $json -Raw | ConvertFrom-Json
          if ($cfg.vam_root -ne $vam) { throw "launcher.json vam_root '$($cfg.vam_root)' is not '$vam'" }
          # 3. the installed app uses that folder (no picker, nothing started)
          $chk = Join-Path $env:RUNNER_TEMP "check-vam-root.json"
          $p = Start-Process -FilePath $exe -ArgumentList "--check-vam-root","--selftest-out","`"$chk`"" -Wait -PassThru
          Get-Content $chk
          if ($p.ExitCode -ne 0) { throw "the installed app found no VaM folder" }
          $r = Get-Content $chk -Raw | ConvertFrom-Json
          if ($r.vam_root -ne $vam -or $r.how -ne "remembered") { throw "the installed app uses '$($r.vam_root)' ($($r.how))" }
          # 4. self-test of the installed copy
          $out = Join-Path $env:RUNNER_TEMP "selftest-installed.json"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest","--selftest-out","`"$out`"" -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "installed self-test failed" }
          if ((Get-Content $out -Raw | ConvertFrom-Json).version -ne $v) { throw "installed self-test reports another version" }
          # 4b. same-version reinstall over a RUNNING companion with an old package put back: no question (silent),
          #     the companion is ended (taskkill), files replaced, old package removed, new one in place
          New-Item -ItemType File -Force (Join-Path $pk "d0n.AIBody.42.var") | Out-Null
          $running = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          if ($running.HasExited) { throw "the started companion ended by itself (exit code $($running.ExitCode)); cannot test the kill" }
          $log2 = Join-Path $env:RUNNER_TEMP "setup-reinstall.log"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/VAMDIR=`"$vam`"","/LOG=`"$log2`"" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Get-Content $log2 | Select-Object -Last 60; throw "reinstall over the running companion hung (180 s)" }
          Select-String -Path $log2 -Pattern "Existing install|Package:|Remove older|Deleted|taskkill|in use|Restart" | ForEach-Object { $_.Line }
          if ($p.ExitCode -ne 0) { Get-Content $log2 | Select-Object -Last 60; throw "reinstall exit code $($p.ExitCode)" }
          Start-Sleep -Seconds 2
          if (-not $running.HasExited) { throw "the running companion was not ended by the reinstall" }
          if (-not (Select-String -Path $log2 -Pattern "Existing install: same version $v" -Quiet)) { throw "same version not detected" }
          if (-not (Select-String -Path $log2 -Pattern "silent setup, continuing without asking" -Quiet)) { throw "silent reinstall asked or stopped" }
          if (-not (Select-String -Path $log2 -Pattern 'taskkill /F /IM "AIBody Companion.exe" exit code 0' -SimpleMatch -Quiet)) { throw "the companion was not ended by taskkill" }
          Assert-Packages "same-version reinstall"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest","--selftest-out","`"$out`"" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Get-Content $out -Raw | ConvertFrom-Json).version -ne $v) { throw "self-test after the reinstall failed" }
          if ((Get-Content $json -Raw | ConvertFrom-Json).vam_root -ne $vam) { throw "launcher.json lost by the reinstall" }
          Write-Host "reinstall over a running companion ok"
          # 4c. an older installed version (recorded DisplayVersion set back) is reported as an update
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{7522ADEB-3287-40BF-92C0-136F44CA092B}_is1"
          Set-ItemProperty -Path $key -Name DisplayVersion -Value "43"
          $log3 = Join-Path $env:RUNNER_TEMP "setup-update.log"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/VAMDIR=`"$vam`"","/LOG=`"$log3`"" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "update setup hung (180 s)" }
          Select-String -Path $log3 -Pattern "Existing install" | ForEach-Object { $_.Line }
          if ($p.ExitCode -ne 0) { throw "update setup exit code $($p.ExitCode)" }
          if (-not (Select-String -Path $log3 -Pattern "Update from AIBody 43 to $v" -SimpleMatch -Quiet)) { throw "update from 43 not detected" }
          if ((Get-ItemProperty -Path $key).DisplayVersion -ne $v) { throw "DisplayVersion not back at $v" }
          Assert-Packages "update from 43"
          Write-Host "update detection ok"
          # 4d. a failed install (a companion file locked, Restart Manager off) must keep the older package: v44 deleted it
          #     before copying and the rollback then removed the new one too (Don 21:25). Then a normal run places the
          #     new package (bundled SHA-256) and only after that removes the old one.
          Remove-Item $newvar -Force
          New-Item -ItemType File -Force (Join-Path $pk "d0n.AIBody.42.var") | Out-Null
          $lockFile = (Get-ChildItem (Join-Path $app "_internal") -Filter *.dll -File | Select-Object -First 1).FullName
          $ready = Join-Path $env:RUNNER_TEMP "lock-ready.txt"
          Remove-Item $ready -ErrorAction SilentlyContinue
          $locker = Start-Process pwsh -PassThru -WindowStyle Hidden -ArgumentList "-NoProfile","-Command","`$f = [IO.File]::Open('$lockFile', 'Open', 'Read', 'None'); Set-Content '$ready' ok; Start-Sleep 600"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $ready); $i++) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path $ready)) { throw "could not lock $lockFile" }
          Write-Host "locked $lockFile"
          $log4 = Join-Path $env:RUNNER_TEMP "setup-failed.log"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NOCLOSEAPPLICATIONS","/NORESTART","/CURRENTUSER","/VAMDIR=`"$vam`"","/LOG=`"$log4`"" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Stop-Process -Id $locker.Id -Force; Get-Content $log4 | Select-Object -Last 60; throw "failed-install case hung (240 s)" }
          Stop-Process -Id $locker.Id -Force
          Start-Sleep -Seconds 2
          Select-String -Path $log4 -Pattern "Package:|Remove older|Deleted|DeleteFile|in use|Defaulting|Rolling back|Installation process" | ForEach-Object { $_.Line }
          if ($p.ExitCode -eq 0) { Get-Content $log4 | Select-Object -Last 60; throw "failed-install case: the setup did not fail (exit code 0); the lock did not work" }
          if (-not (Test-Path (Join-Path $pk "d0n.AIBody.42.var"))) { throw "failed-install case: the older package was deleted although the install failed" }
          if (Select-String -Path $log4 -Pattern "Remove older AIBody packages" -SimpleMatch -Quiet) { throw "failed-install case: old packages were handled before the install succeeded" }
          Write-Host "failed install (exit code $($p.ExitCode)) kept d0n.AIBody.42.var"
          $log5 = Join-Path $env:RUNNER_TEMP "setup-after-failed.log"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/VAMDIR=`"$vam`"","/LOG=`"$log5`"" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "setup after the failed install hung (180 s)" }
          Select-String -Path $log5 -Pattern "Package:|Remove older|Deleted|Dest filename: .*AddonPackages" | ForEach-Object { $_.Line }
          if ($p.ExitCode -ne 0) { Get-Content $log5 | Select-Object -Last 60; throw "setup after the failed install: exit code $($p.ExitCode)" }
          Assert-Packages "after a failed install"
          if (-not (Select-String -Path $log5 -Pattern "in place (SHA-256 checked)" -SimpleMatch -Quiet)) { throw "package check not logged" }
          $copied = (Select-String -Path $log5 -Pattern "Dest filename: $newvar" -SimpleMatch | Select-Object -First 1).LineNumber
          $removed = (Select-String -Path $log5 -Pattern "Remove older AIBody packages: found" -SimpleMatch | Select-Object -First 1).LineNumber
          if (-not ($copied -and $removed -and $removed -gt $copied)) { throw "older packages must be removed after the new one was copied (lines $copied / $removed)" }
          Write-Host "failed install keeps the old package; the next run places the new one first, then removes the old one"
          # 5. uninstall removes the app and its launcher settings
          $p = Start-Process -FilePath (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "uninstall left $exe" }
          if (Test-Path $json) { throw "uninstall left $json" }
          if (Test-Path $newvar) { throw "uninstall left $newvar" }
          foreach ($n in "d0n.AIBodySession.3.var","d0n.AIBody.x.var","other.AIBody.1.var","Sub\d0n.AIBody.40.var","..\VaM.exe") {
            if (-not (Test-Path (Join-Path $pk $n))) { throw "uninstall deleted $n (not ours)" }
          }
          Write-Host "uninstall deleted d0n.AIBody.$v.var only"
          Write-Host "VAMDIR / launcher.json / install / package / reinstall over running companion / update / failed install keeps old package / self-test / uninstall (own VARs only) ok"

      - name: Token scan
        run: python tools/scan_tokens.py "dist/AIBody Companion" dist/installer companion/aibody_companion "dist/d0n.AIBody.${{ steps.ver.outputs.version }}.var"

      - uses: actions/upload-artifact@v4
        with:
          name: AIBody-Companion-Setup-${{ steps.ver.outputs.version }}
          path: |
            dist/installer/AIBody Companion Setup.exe
            dist/d0n.AIBody.${{ steps.ver.outputs.version }}.var
          if-no-files-found: error
